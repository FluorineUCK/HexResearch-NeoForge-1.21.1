archivesBaseName = getArtifactId("neoforge")
def enableClientWorldProbe = providers.gradleProperty("hexresearchClientWorldProbe").present

architectury {
    platformSetupLoomIde()
    neoForge {
        platformPackage = "forge"
    }
}

loom {
    if (enableClientWorldProbe) {
        runs {
            client {
                vmArg "-Dhexresearch.probe.requireClientWorld=true"
                programArgs(["--quickPlaySingleplayer", "HexResearchProbePre2"])
            }
        }
    }
}

configurations {
    common
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

repositories {
    mavenCentral()
}

dependencies {
    modCompileOnly(group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.2') // for @Nonnull

    neoForge "net.neoforged:neoforge:${project.neoForgeVersion}"
    modApi "dev.architectury:architectury-neoforge:${project.architecturyVersion}"

    // mixin extras
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinExtrasVersion}"))
    runtimeOnly(include("io.github.llamalad7:mixinextras-neoforge:${mixinExtrasVersion}"))

    compileOnly files(rootProject.file("hexcasting-neoforge-${minecraftVersion}-${hexcastingVersion}.jar"))
    runtimeOnly files(rootProject.file("hexcasting-neoforge-${minecraftVersion}-${hexcastingVersion}.jar"))

    runtimeOnly "thedarkcolour:kotlinforforge-neoforge:$project.forgeKotlinVersion"
    runtimeOnly files(rootProject.file("paucal-0.7.1-pre-27+${minecraftVersion}-neoforge.jar"))
    compileOnly "vazkii.patchouli:Patchouli:${project.patchouliVersion}"
    runtimeOnly "vazkii.patchouli:Patchouli:${project.patchouliVersion}"
    runtimeOnly files(rootProject.file("caelus-neoforge-${project.caelusVersion}.jar"))
    runtimeOnly files(rootProject.file("inline-${project.inlineVersion}-devruntime.jar"))
    runtimeOnly "me.shedaniel.cloth:cloth-config-neoforge:${project.clothConfigVersion}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

remapJar {
    input.set jar.archiveFile
    dependsOn jar
    archiveClassifier.set null
}

jar {
    dependsOn project(":common").tasks.named("classes")
    from project(":common").sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude "fabric.mod.json"
    exclude "architectury.common.json"
    exclude "name/dashkal/minecraft/hexresearch/forge/probe/**"
    archiveClassifier.set "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

// this fixes mod's hex notebook additions missing in dev runtime because of something with how patchouli handles its data
// the only other thing that could fix it was adding common's resources to srcDirs directly,
// but that lead to the built jar causing mixin injection crashes in non-dev environments
// feel free to reach out if you manage to fix this without copying the book data
tasks.register("clearGeneratedBook", Delete) {
    description "Clear the book in generated resources."

    delete "src/generated/resources/$bookPath"
}
tasks.register("copyBookToGenerated", Copy) {
    description "Copy the book from resources to generated resources."

    from "../common/src/main/resources/$bookPath"
    into "src/generated/resources/$bookPath"
}
tasks.copyBookToGenerated.dependsOn(tasks.clearGeneratedBook)
tasks.processResources.dependsOn(tasks.copyBookToGenerated)
tasks.sourcesJar.dependsOn(tasks.copyBookToGenerated)

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = project.archivesBaseName + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}

